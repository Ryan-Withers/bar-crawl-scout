name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-crawl-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run token-lint  # THE ART CRITIC — anti-AI floor
      - run: npm run coverage    # THE AUDITOR + THE BOUNCER + coverage gate
      - run: npm run build
      - run: npm run bundle-budget  # THE STOPWATCH — JS stays small, no 5MB blob

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-crawl-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e   # THE REGULARS — E2E on a mocked preview build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: bar-crawl-scout/playwright-report/
          retention-days: 7
