# THE HEALTH INSPECTOR (Fable File 03, Part 4). Runs where the network is live —
# never in a PR. Nightly drift check + on-demand post-deploy smoke.
name: Inspector

on:
  schedule:
    - cron: "0 20 * * *" # ~6am AEST, nightly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-crawl-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - id: drift
        run: npm run drift
        continue-on-error: true
      - name: Open an issue if Sleeper drifted
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Sleeper API drift detected',
              body: `The nightly drift check failed schema validation. Update the Zod schemas + fixtures together.\n\n[Run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['drift'],
            });

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-crawl-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Full crawl (every link + button, mocked preview)
        run: npm run e2e:crawl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: bar-crawl-scout/playwright-report/
          retention-days: 7
