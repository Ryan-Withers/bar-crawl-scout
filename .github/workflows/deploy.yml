# Build the Vite + Svelte SPA (which lives in bar-crawl-scout/) and publish it to
# GitHub Pages on every push to main. The app uses relative asset paths (vite
# base: './') and hash routing, so it works served from the /bar-crawl-scout/
# project subpath with no extra config.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-crawl-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # turn on Pages automatically if it isn't already
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bar-crawl-scout/dist  # artifact path is relative to the repo root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
